<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Inloggning - Aurelia Market</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .test-users {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .test-users h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .test-user {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .test-user:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }
        
        .test-user strong {
            display: block;
            color: #667eea;
            margin-bottom: 4px;
        }
        
        .test-user small {
            color: #666;
            font-size: 12px;
        }
        
        .response-details {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .response-details pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test Inloggning</h1>
        <p class="subtitle">Aurelia Market - Direkt API-test</p>
        
        <div id="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-postadress</label>
                <input type="email" id="email" required placeholder="din@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Lösenord</label>
                <input type="password" id="password" required placeholder="Ditt lösenord">
            </div>
            
            <button type="submit" id="submitBtn">Logga In</button>
        </form>
        
        <div class="test-users">
            <h3>📋 Testanvändare (klicka för att fylla i)</h3>
            
            <div class="test-user" onclick="fillForm('ngabulokana@gmail.com', 'a-z, A-Z, 0-9')">
                <strong>👑 Admin</strong>
                <small>ngabulokana@gmail.com</small>
            </div>
            
            <div class="test-user" onclick="fillForm('test@example.com', 'test123456')">
                <strong>👤 Testanvändare</strong>
                <small>test@example.com</small>
            </div>
            
            <div class="test-user" onclick="createNewUser()">
                <strong>➕ Skapa ny testanvändare</strong>
                <small>Genererar automatiskt email och lösenord</small>
            </div>
        </div>
        
        <div id="responseDetails"></div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3001';
        
        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }
        
        function showResponse(title, data) {
            const responseDiv = document.getElementById('responseDetails');
            responseDiv.innerHTML = `
                <strong>${title}</strong>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }
        
        function fillForm(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            showMessage('Formulär ifyllt! Klicka på "Logga In" för att testa.', 'info');
        }
        
        async function createNewUser() {
            const email = `test${Date.now()}@gmail.com`;
            const password = 'testpassword123';
            
            showMessage('Skapar ny testanvändare...', 'info');
            
            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    fillForm(email, password);
                    showMessage(`✅ Ny användare skapad! Email: ${email}`, 'success');
                    showResponse('Registrering lyckades:', data);
                } else {
                    showMessage(`❌ Kunde inte skapa användare: ${data.error}`, 'error');
                    showResponse('Registrering misslyckades:', data);
                }
            } catch (error) {
                showMessage(`❌ Fel: ${error.message}`, 'error');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Loggar in...';
            showMessage('Försöker logga in...', 'info');
            
            try {
                console.log('Skickar login-request till:', `${API_URL}/api/auth/login`);
                console.log('Email:', email);
                console.log('Lösenord:', password);
                
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                    cache: 'no-store'
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    showMessage(`✅ Inloggning lyckades! Välkommen ${data.user.email}`, 'success');
                    showResponse('Inloggning lyckades:', {
                        status: response.status,
                        user: data.user,
                        token: data.token.substring(0, 50) + '...',
                        fullToken: data.token
                    });
                    
                    // Spara i localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    console.log('Token sparad i localStorage');
                } else {
                    showMessage(`❌ Inloggning misslyckades: ${data.error}`, 'error');
                    showResponse('Inloggning misslyckades:', {
                        status: response.status,
                        error: data.error,
                        fullResponse: data
                    });
                }
            } catch (error) {
                console.error('Fel vid inloggning:', error);
                showMessage(`❌ Fel: ${error.message}`, 'error');
                showResponse('Fel uppstod:', {
                    error: error.message,
                    stack: error.stack
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Logga In';
            }
        });
        
        // Visa om användare redan är inloggad
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (token && user) {
                const userData = JSON.parse(user);
                showMessage(`ℹ️ Du är redan inloggad som ${userData.email}`, 'info');
            }
        });
    </script>
</body>
</html>
